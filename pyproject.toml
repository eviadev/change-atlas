[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "change-atlas"
version = "0.1.0"
description = "Evidence-first software archaeology from Git history"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "eviadev" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
change-atlas = "change_atlas.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["change_atlas*"]
